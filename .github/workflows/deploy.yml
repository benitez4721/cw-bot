name: Deploy

# Triggers Render via Deploy Hook **after** CI passes on main.
# Render's autoDeploy is disabled in render.yaml so this workflow is
# the only path that promotes code to production.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret not set"
            exit 1
          fi
          response=$(curl -fsSL -w "\n%{http_code}" -X POST "$DEPLOY_HOOK")
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" -ge 300 ]; then
            echo "::error::Deploy hook returned $status"
            exit 1
          fi
